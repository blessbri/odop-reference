name: Release check
on: [pull_request]
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/protocol/test_odop_json_v1_parser.py tests/protocol/test_v1_structural_validation.py tests/protocol/test_v1_json_integration.py
      - run: python -m compileall packages

