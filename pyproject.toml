[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odop-reference"
version = "1.0.0"
description = "ODOP Version 1 reference implementation and local structural toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["packages/protocol-model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

